name: Validate pilot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run build
      - run: npm test
  backend:
    needs: frontend
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///${{ runner.temp }}/blaze-ci.db
      ENABLE_LEGACY: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  container:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t blaze-pilot:ci .
      - name: Check single-port container
        shell: bash
        run: |
          docker run -d --name blaze-pilot-ci -p 127.0.0.1:7777:7777 \
            -e ENVIRONMENT=test -e DEBUG=false -e DATABASE_URL=sqlite:////tmp/ci.db \
            -e ENABLE_LEGACY=false blaze-pilot:ci
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:7777/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:7777/api/health
          curl -fsS http://127.0.0.1:7777/login | grep -qi '<!doctype html>'
          curl -fsS http://127.0.0.1:7777/demo/reviewer/review | grep -qi '<!doctype html>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7777/api/not-found)" = 404
      - name: Container diagnostics
        if: failure()
        run: docker logs blaze-pilot-ci
      - name: Remove disposable CI container
        if: always()
        run: docker rm -f blaze-pilot-ci || true
