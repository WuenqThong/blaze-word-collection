# Install on the company HTTPS reverse proxy; replace domain and certificate paths.
server {
    listen 80;
    server_name blaze.company.example;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name blaze.company.example;
    ssl_certificate /etc/letsencrypt/live/blaze.company.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blaze.company.example/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
