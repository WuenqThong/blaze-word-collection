services:
  minio:
    image: minio/minio:latest
    container_name: annotator-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"   # S3 API
      - "9101:9001"   # Web console
    volumes:
      - minio_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: annotator-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb -p local/audios || true;
        mc anonymous set none local/audios || true;
        echo 'bucket ready';
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: annotator-backend
    restart: unless-stopped
    ports:
      - "8765:8000"
    environment:
      DATABASE_URL: sqlite:////data/annotator.db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_BUCKET: audios
      CORS_ORIGINS: '["http://localhost:7777","http://127.0.0.1:7777"]'
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - backend_data:/data
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: annotator-frontend
    restart: unless-stopped
    ports:
      - "7777:7777"
    environment:
      VITE_API_BASE_URL: http://localhost:8765/api
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  minio_data:
  backend_data:

networks:
  app-network:
    driver: bridge
