services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BLAZE_IMAGE_REPOSITORY:-blaze-pilot}:${BLAZE_RELEASE:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BLAZE_PORT:-7777}:7777"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      ENABLE_LEGACY: "false"
      DATABASE_URL: sqlite:////data/annotator.db
      JWT_SECRET: ${BLAZE_JWT_SECRET:?Set BLAZE_JWT_SECRET}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      CORS_ORIGINS: ${BLAZE_CORS_ORIGINS:?Set HTTPS company origin as a JSON array}
      TRUSTED_PROXY_IPS: ${BLAZE_TRUSTED_PROXY_IPS:?Set trusted company proxy IPs as a JSON array}
      FRONTEND_DIST: /app/frontend
    volumes:
      - backend_data:/data
volumes:
  backend_data:
